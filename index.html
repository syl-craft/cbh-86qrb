<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flux hydraulique — Piscine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0ea5e9, #0369a1);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    max-width: 1020px;
    width: 100%;
    padding: 20px;
    margin: 8px 0 24px;
  }

  h1 {
    font-size: 1.3rem;
    color: #0369a1;
    text-align: center;
  }

  .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 0.85rem;
    margin: 4px 0 14px;
  }

  /* --- Scénarios --- */
  .scenarios {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .scenarios button {
    padding: 9px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #f8fafc;
    color: #334155;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .scenarios button:hover { border-color: #0ea5e9; color: #0ea5e9; }

  .scenarios button.active {
    background: #0ea5e9;
    border-color: #0ea5e9;
    color: #fff;
  }

  /* --- Contrôles pompe + vanne 6 voies --- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    padding: 10px;
    background: #f1f5f9;
    border-radius: 14px;
  }

  .pump-toggle {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    color: #fff;
    background: #94a3b8;
  }

  .pump-toggle.on { background: #10b981; }
  .pump-toggle.level { background: #10b981; }
  .pump-toggle.level.low { background: #f59e0b; }

  .mp-group { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

  .mp-group .mp-label { font-size: 0.75rem; color: #64748b; font-weight: 600; margin-right: 4px; }

  .mp-group button {
    padding: 6px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #fff;
    font-size: 0.75rem;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
  }

  .mp-group button.active { background: #0369a1; border-color: #0369a1; color: #fff; }

  /* --- SVG --- */
  .scene {
    width: 100%;
    background: #f8fafc;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
  }

  svg { display: block; width: 100%; height: auto; }

  .pipe { stroke: #cbd5e1; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .water { stroke: #0ea5e9; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round;
           stroke-dasharray: 10 14; animation: flow 0.7s linear infinite; pointer-events: none; }
  .gravity { stroke-width: 3; stroke-dasharray: 4 6; animation-duration: 1s; }
  .fresh { stroke: #2dd4bf; }

  .arrows path { fill: #075985; opacity: 0.95; pointer-events: none; }
  .arrows.freshArr path { fill: #0f766e; }

  .valve { cursor: pointer; }
  .valve circle { fill: #fff; stroke-width: 3; }
  .valve.open circle { stroke: #10b981; }
  .valve.closed circle { stroke: #ef4444; }
  .valve rect { rx: 2; }
  .valve.open rect { fill: #10b981; }
  .valve.closed rect { fill: #ef4444; }
  .valve text { font-size: 12px; fill: #475569; font-weight: 600; }

  .lbl { font-size: 13px; fill: #475569; font-weight: 600; }
  .lbl-small { font-size: 11px; fill: #94a3b8; }
  .lbl-white { font-size: 13px; fill: #fff; font-weight: 700; }

  #pumpBody { cursor: pointer; }
  #mpBody { cursor: pointer; }

  /* --- Étapes + alertes --- */
  .warnings { margin-top: 10px; }

  .warning {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .steps {
    margin-top: 12px;
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 14px;
    padding: 14px 16px;
  }

  .steps h3 { font-size: 0.95rem; color: #0369a1; margin-bottom: 4px; }

  .steps .hint { font-size: 0.72rem; color: #94a3b8; margin-bottom: 10px; }

  .steps ol {
    list-style: none;
    counter-reset: step;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .steps li {
    counter-increment: step;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 1px solid #e0f2fe;
    border-left: 4px solid #0ea5e9;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.87rem;
    color: #334155;
    line-height: 1.35;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .steps li:hover { border-color: #0ea5e9; }

  .steps li::before {
    content: counter(step);
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #0ea5e9;
    color: #fff;
    font-weight: 700;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .steps li.done {
    background: #ecfdf5;
    border-color: #a7f3d0;
    border-left-color: #10b981;
    color: #94a3b8;
    text-decoration: line-through;
  }

  .steps li.done::before {
    content: "✓";
    background: #10b981;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-top: 10px;
    font-size: 0.75rem;
    color: #64748b;
  }

  .legend span { display: flex; align-items: center; gap: 5px; }

  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="card">
  <h1>💧 Flux hydraulique de la piscine</h1>
  <div class="subtitle">Disposition fidèle au schéma des vannes · clique sur les vannes, la pompe ou la vanne 6 voies</div>

  <div class="scenarios" id="scenarios"></div>

  <div class="controls">
    <button class="pump-toggle" id="pumpBtn">⏻ Pompe</button>
    <button class="pump-toggle level" id="levelBtn">💧 Bac tampon : niveau OK</button>
    <div class="mp-group" id="mpGroup"><span class="mp-label">Vanne 6 voies :</span></div>
  </div>

  <div class="scene">
  <svg viewBox="0 0 960 880" xmlns="http://www.w3.org/2000/svg">
    <!-- ================= BASSINS ================= -->
    <!-- Piscine -->
    <rect x="90" y="40" width="470" height="210" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2.5"/>
    <text class="lbl" x="325" y="100" text-anchor="middle">Piscine (à débordement)</text>
    <path d="M90,75 A70,70 0 0 0 90,215 Z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text class="lbl-small" x="52" y="148" text-anchor="middle">Marches</text>

    <!-- Bonde + balai dans la piscine -->
    <circle cx="140" cy="228" r="7" fill="#fff" stroke="#0369a1" stroke-width="2.5"/>
    <text class="lbl-small" x="140" y="214" text-anchor="middle">bonde</text>
    <circle cx="300" cy="228" r="7" fill="#fff" stroke="#0369a1" stroke-width="2.5"/>
    <text class="lbl-small" x="300" y="214" text-anchor="middle">balai</text>

    <!-- Bassin rond -->
    <circle cx="615" cy="350" r="45" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2.5"/>
    <text class="lbl-small" x="615" y="354" text-anchor="middle">Bassin rond</text>

    <!-- Bac tampon -->
    <rect x="700" y="430" width="150" height="100" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
    <rect id="bacWater" x="702" y="434" width="146" height="92" rx="6" fill="#bae6fd"/>
    <text class="lbl" x="775" y="480" text-anchor="middle">Bac tampon</text>
    <circle cx="720" cy="510" r="6" fill="#fff" stroke="#0369a1" stroke-width="2.5"/>
    <circle cx="830" cy="510" r="6" fill="#fff" stroke="#0369a1" stroke-width="2.5"/>

    <!-- Capteur de niveau -->
    <g id="sensorBody" style="cursor:pointer">
      <line x1="735" y1="436" x2="735" y2="500" stroke="#475569" stroke-width="2.5"/>
      <circle id="sensorFloat" cx="735" cy="442" r="7" fill="#475569"/>
      <text class="lbl-small" x="735" y="424" text-anchor="middle">capteur</text>
    </g>

    <!-- Remplissage automatique (eau de ville) -->
    <path id="p_ev" class="pipe" style="stroke-width:6" d="M790,360 L790,430"/>
    <g id="evBody" style="cursor:pointer">
      <rect id="evRect" x="778" y="380" width="24" height="24" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    </g>
    <text class="lbl-small" x="790" y="352" text-anchor="middle">eau de ville (électrovanne)</text>

    <!-- Débordement (gravitaire) -->
    <path id="p_over" class="pipe" style="stroke-width:3" d="M560,70 L770,70 L770,430"/>
    <text class="lbl-small" x="620" y="60">débordement (gravité)</text>

    <!-- Local technique -->
    <rect x="75" y="325" width="875" height="510" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="lbl-small" x="95" y="348">LOCAL TECHNIQUE</text>

    <!-- ================= TUYAUX (sens = sens de l'eau) ================= -->
    <!-- Aspirations -->
    <path id="p_vb"    class="pipe" d="M140,250 L140,470"/>
    <path id="p_vbl"   class="pipe" d="M300,250 L300,470"/>
    <path id="p_vbb"   class="pipe" d="M615,395 L615,470"/>
    <path id="p_vbt1"  class="pipe" d="M720,516 L720,560 L640,560 L640,470"/>
    <path id="p_vbt2"  class="pipe" d="M830,516 L830,575 L590,575 L590,470"/>
    <!-- Collecteur (gauche vers pompe, droite vers pompe) -->
    <path id="p_colL1" class="pipe" d="M140,470 L300,470"/>
    <path id="p_colL2" class="pipe" d="M300,470 L430,470"/>
    <path id="p_colR1" class="pipe" d="M640,470 L615,470"/>
    <path id="p_colR2" class="pipe" d="M615,470 L590,470"/>
    <path id="p_colR3" class="pipe" d="M590,470 L430,470"/>
    <path id="p_feed"  class="pipe" d="M430,470 L430,574"/>

    <!-- Pompe -> vanne 6 voies -> filtre -->
    <path id="p_pout" class="pipe" d="M456,600 L490,600"/>
    <path id="p_mpf"  class="pipe" d="M512,625 L512,660"/>
    <path id="p_mpfo" class="pipe" d="M558,660 L558,625"/>
    <!-- Sortie vers électrolyseur (montée à droite) -->
    <path id="p_mpo"  class="pipe" d="M580,600 L880,600 L880,540"/>
    <path id="p_eli"  class="pipe" d="M880,540 L880,466"/>
    <path id="p_elo"  class="pipe" d="M880,378 L880,300"/>
    <path id="p_byp"  class="pipe" d="M880,540 L925,540 L925,300 L880,300"/>
    <path id="p_fman" class="pipe" d="M880,300 L880,272"/>
    <!-- Nourrice de refoulement -->
    <path id="p_man1" class="pipe" d="M880,272 L615,272"/>
    <path id="p_manb" class="pipe" d="M615,272 L615,303"/>
    <path id="p_man2" class="pipe" d="M615,272 L560,272 L560,290 L480,290"/>
    <path id="p_man3" class="pipe" d="M480,290 L200,290"/>
    <path id="p_jr1"  class="pipe" d="M200,290 L200,252"/>
    <path id="p_jr2"  class="pipe" d="M250,290 L250,252"/>
    <path id="p_jr3"  class="pipe" d="M480,290 L480,252"/>
    <!-- Égout -->
    <path id="p_ego"  class="pipe" d="M490,612 L470,612 L470,800 L900,800"/>
    <text class="lbl" x="912" y="790">Égout</text>
    <path d="M900,812 q8,-8 16,0 q8,8 16,0" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M905,824 q8,-8 16,0 q8,8 16,0" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <!-- ================= ÉQUIPEMENTS ================= -->
    <!-- Pompe -->
    <g id="pumpBody">
      <circle id="pumpCircle" cx="430" cy="600" r="26" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
      <path d="M421,611 L421,589 L443,600 Z" fill="#fff"/>
      <text class="lbl" x="405" y="648">Pompe + préfiltre</text>
    </g>

    <!-- Vanne 6 voies -->
    <g id="mpBody">
      <rect x="490" y="575" width="90" height="50" rx="8" fill="#334155" stroke="#0f172a" stroke-width="2"/>
      <text class="lbl-white" x="535" y="596" text-anchor="middle">6 voies</text>
      <text class="lbl-white" id="mpPosText" x="535" y="614" text-anchor="middle" style="font-size:10px; fill:#7dd3fc">FILTRATION</text>
    </g>

    <!-- Filtre à sable (carré avec cercle, comme le schéma) -->
    <rect x="485" y="660" width="100" height="100" rx="8" fill="#fff" stroke="#475569" stroke-width="2.5"/>
    <circle cx="535" cy="710" r="36" fill="#ef4444" stroke="#b91c1c" stroke-width="2.5"/>
    <text class="lbl-white" x="535" y="706" text-anchor="middle" style="font-size:11px">Filtre</text>
    <text class="lbl-white" x="535" y="720" text-anchor="middle" style="font-size:11px">sable</text>

    <!-- Électrolyseur -->
    <g id="electroBody">
      <rect id="electroRect" x="858" y="380" width="44" height="84" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
      <text class="lbl-small" x="850" y="415" text-anchor="end">Électrolyseur</text>
      <text class="lbl-small" id="electroState" x="850" y="430" text-anchor="end">arrêté</text>
    </g>
    <text class="lbl-small" x="947" y="425" text-anchor="end">bypass</text>

    <!-- Label refoulements -->
    <text class="lbl-small" x="330" y="315" text-anchor="middle">refoulements piscine (chacun sa vanne)</text>

    <!-- Vannes (injectées en JS) -->
    <g id="valves"></g>
  </svg>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:#0ea5e9"></span> eau en circulation</span>
    <span><span class="dot" style="background:#2dd4bf"></span> eau de ville (remplissage auto)</span>
    <span><span class="dot" style="background:#cbd5e1"></span> tuyau inactif</span>
    <span><span class="dot" style="background:#10b981"></span> vanne ouverte</span>
    <span><span class="dot" style="background:#ef4444"></span> vanne fermée</span>
  </div>

  <div class="warnings" id="warnings"></div>

  <div class="steps" id="steps"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';

  // ---------- Vannes ----------
  const VALVES = {
    vb:   { x: 140, y: 390, label: 'Bonde piscine',  lx: 14,   ly: 4,   open: false },
    vbl:  { x: 300, y: 390, label: 'Balai',          lx: 14,   ly: 4,   open: false },
    vbb:  { x: 615, y: 432, label: 'Bonde bassin',   lx: -102, ly: 4,   open: true  },
    vbt1: { x: 680, y: 560, label: 'Bonde bac 1',    lx: -34,  ly: -18, open: true  },
    vbt2: { x: 740, y: 575, label: 'Bonde bac 2',    lx: -20,  ly: 26,  open: true  },
    vr1:  { x: 200, y: 271, label: '',               lx: 0,    ly: 0,   open: true  },
    vr2:  { x: 250, y: 271, label: '',               lx: 0,    ly: 0,   open: true  },
    vr3:  { x: 480, y: 271, label: '',               lx: 0,    ly: 0,   open: true  },
    vrb:  { x: 615, y: 288, label: 'Refoul. bassin', lx: -112, ly: 4,   open: true  },
    ve:   { x: 470, y: 700, label: 'Égout',          lx: 14,   ly: 4,   open: false },
    vel1: { x: 880, y: 520, label: 'entrée',         lx: -56,  ly: 4,   open: true  },
    vel2: { x: 880, y: 340, label: 'sortie',         lx: -56,  ly: 4,   open: true  },
    vby:  { x: 925, y: 420, label: '',               lx: 0,    ly: 0,   open: false },
  };

  const MP_POSITIONS = [
    { id: 'filtration',  label: 'Filtration'  },
    { id: 'lavage',      label: 'Lavage'      },
    { id: 'rincage',     label: 'Rinçage'     },
    { id: 'egout',       label: 'Égout'       },
    { id: 'circulation', label: 'Circulation' },
    { id: 'ferme',       label: 'Fermé'       },
    { id: 'hivernage',   label: 'Hivernage'   },
  ];

  const state = { pump: true, pos: 'filtration', scenario: 'filtration', lowLevel: false };
  let renderedScenario = null;

  // ---------- Scénarios ----------
  const SCENARIOS = {
    filtration: {
      label: '🔄 Filtration normale',
      pump: true, pos: 'filtration',
      v: { vbt1: true, vbt2: true, vb: false, vbl: false, vbb: true, vr1: true, vr2: true, vr3: true, vrb: true, ve: false, vel1: true, vel2: true, vby: false },
      title: 'Filtration normale (avec bac tampon)',
      steps: [
        'Les deux bondes du bac tampon ouvertes, bonde de fond et balai fermés',
        'Vanne 6 voies sur FILTRATION',
        'Refoulements piscine (3 vannes) et bassin rond ouverts, vanne égout fermée',
        'Électrolyseur en service (vannes entrée + sortie ouvertes, bypass fermé)',
        'La piscine déborde → le bac tampon récupère l\'eau → la pompe aspire dans le bac',
      ],
    },
    sansbac: {
      label: '🚱 Filtration sans bac tampon',
      pump: true, pos: 'filtration',
      v: { vbt1: false, vbt2: false, vb: true, vbl: false, vbb: true, vr1: true, vr2: true, vr3: true, vrb: true, ve: false, vel1: true, vel2: true, vby: false },
      title: 'Filtration sans bac tampon',
      steps: [
        'Fermer les deux bondes du bac tampon',
        'Ouvrir la bonde de fond de la piscine',
        'Vanne 6 voies sur FILTRATION, refoulements ouverts',
        '⚠️ Le débordement continue de remplir le bac tampon : surveiller le niveau de la piscine (l\'eau part dans le bac et n\'est pas réaspirée)',
      ],
    },
    lavage: {
      label: '🧹 Nettoyage filtre à sable',
      pump: true, pos: 'lavage',
      v: { vbt1: false, vbt2: false, vb: true, vbl: false, vbb: false, vr1: false, vr2: false, vr3: false, vrb: false, ve: true, vel1: false, vel2: false, vby: false },
      title: 'Nettoyage du filtre à sable — ordre anti-surpression',
      steps: [
        'Couper l\'ÉLECTROLYSEUR (toujours avant la pompe)',
        'Arrêter la POMPE',
        'OUVRIR la vanne égout AVANT de fermer les refoulements → il y a toujours une sortie ouverte',
        'Fermer les refoulements piscine (3 vannes) et bassin',
        'Ouvrir l\'aspiration bonde de fond (fermer les bondes du bac tampon si le niveau est trop bas)',
        'Tourner la vanne 6 voies sur LAVAGE — UNIQUEMENT pompe à l\'arrêt (sinon surpression et joint étoile endommagé)',
        'Démarrer la pompe : lavage 2–3 min, jusqu\'à ce que le voyant du filtre soit clair',
        'Arrêter la pompe, tourner sur RINÇAGE, pompe 30 s, arrêter la pompe',
        'Tourner sur FILTRATION (pompe toujours à l\'arrêt)',
        'ROUVRIR les refoulements AVANT de refermer la vanne égout → jamais toutes sorties fermées',
        'Rétablir l\'aspiration normale (bondes bac tampon), fermer la bonde si besoin',
        'Démarrer la pompe, vérifier la pression au manomètre, puis relancer l\'électrolyseur',
      ],
    },
    prefiltre: {
      label: '🧺 Nettoyage préfiltre pompe',
      pump: false, pos: 'ferme',
      v: { vbt1: false, vbt2: false, vb: false, vbl: false, vbb: false, vr1: false, vr2: false, vr3: false, vrb: false, ve: false, vel1: false, vel2: false, vby: false },
      title: 'Nettoyage du préfiltre de la pompe (panier)',
      steps: [
        'Arrêter la pompe et couper l\'électrolyseur',
        'Fermer TOUTES les vannes d\'aspiration (2 bondes bac tampon, bonde, balai, bonde bassin)',
        'Fermer les refoulements pour éviter le retour d\'eau, vanne 6 voies sur FERMÉ',
        'Ouvrir le couvercle de la pompe, sortir et rincer le panier',
        'Remettre le panier, vérifier le joint du couvercle, refermer',
        'Rouvrir les vannes, remplir le préfiltre d\'eau (amorçage), relancer la pompe',
      ],
    },
    hivernage: {
      label: '❄️ Hivernage',
      pump: false, pos: 'hivernage',
      v: { vbt1: false, vbt2: false, vb: false, vbl: false, vbb: false, vr1: false, vr2: false, vr3: false, vrb: false, ve: false, vel1: false, vel2: false, vby: false },
      title: 'Hivernage',
      steps: [
        'Faire un dernier lavage + rinçage du filtre, puis arrêter la pompe',
        'Couper et vidanger l\'électrolyseur (retirer la cellule si gel possible), fermer ses 3 vannes',
        'Baisser le niveau d\'eau sous les refoulements, vider le bac tampon',
        'Fermer toutes les vannes',
        'Vidanger la pompe, le préfiltre et le filtre à sable (bouchons de purge)',
        'Mettre la vanne 6 voies en position HIVERNAGE (entre deux positions)',
        'Traitement d\'hivernage dans l\'eau et couverture',
      ],
    },
  };

  // ---------- Construction UI ----------
  function buildScenarios() {
    Object.entries(SCENARIOS).forEach(([id, sc]) => {
      const b = document.createElement('button');
      b.textContent = sc.label;
      b.id = 'sc_' + id;
      b.addEventListener('click', () => applyScenario(id));
      $('scenarios').appendChild(b);
    });
  }

  function buildMpButtons() {
    MP_POSITIONS.forEach(p => {
      const b = document.createElement('button');
      b.textContent = p.label;
      b.id = 'mp_' + p.id;
      b.addEventListener('click', () => { state.pos = p.id; state.scenario = null; update(); });
      $('mpGroup').appendChild(b);
    });
  }

  function buildValves() {
    const g = $('valves');
    Object.entries(VALVES).forEach(([id, v]) => {
      const grp = document.createElementNS(SVGNS, 'g');
      grp.setAttribute('class', 'valve');
      grp.id = 'valve_' + id;
      grp.innerHTML =
        '<circle cx="' + v.x + '" cy="' + v.y + '" r="11"/>' +
        '<rect x="' + (v.x - 8) + '" y="' + (v.y - 3) + '" width="16" height="6"/>' +
        (v.label ? '<text x="' + (v.x + v.lx) + '" y="' + (v.y + v.ly) + '">' + v.label + '</text>' : '');
      grp.addEventListener('click', () => { v.open = !v.open; state.scenario = null; update(); });
      g.appendChild(grp);
    });
  }

  // Superpose un tracé "eau" animé sur chaque tuyau
  function buildWaterOverlays() {
    document.querySelectorAll('path.pipe').forEach(p => {
      const w = p.cloneNode();
      w.setAttribute('class', 'water' + (p.id === 'p_over' ? ' gravity' : '') + (p.id === 'p_ev' ? ' fresh' : ''));
      w.id = 'w_' + p.id;
      w.style.display = 'none';
      p.parentNode.insertBefore(w, p.nextSibling);
    });
  }

  // Flèches de direction le long de chaque tuyau (sens de l'eau)
  function buildArrows() {
    document.querySelectorAll('path.pipe').forEach(p => {
      const total = p.getTotalLength();
      const grp = document.createElementNS(SVGNS, 'g');
      grp.setAttribute('class', 'arrows' + (p.id === 'p_ev' ? ' freshArr' : ''));
      grp.id = 'arr_' + p.id;
      grp.style.display = 'none';

      const spacing = 80;
      const positions = total < 50
        ? [total / 2]
        : Array.from({ length: Math.floor((total - 40) / spacing) + 1 }, (_, i) => 40 + i * spacing);

      positions.forEach(d => {
        const pt = p.getPointAtLength(d);
        const ahead = p.getPointAtLength(Math.min(d + 5, total));
        const angle = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180 / Math.PI;
        const a = document.createElementNS(SVGNS, 'path');
        a.setAttribute('d', 'M6,0 L-5,5.5 L-2,0 L-5,-5.5 Z');
        a.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ') rotate(' + angle + ')');
        grp.appendChild(a);
      });
      p.parentNode.insertBefore(grp, p.nextSibling.nextSibling);
    });
  }

  // ---------- Logique de flux ----------
  function computeFlow() {
    const v = {};
    Object.entries(VALVES).forEach(([id, val]) => v[id] = val.open);

    const hasSuction = v.vb || v.vbl || v.vbb || v.vbt1 || v.vbt2;
    const elPath  = v.vel1 && v.vel2; // passage dans l'électrolyseur = entrée ET sortie ouvertes
    const outPath = elPath || v.vby;
    const anyRef  = v.vr1 || v.vr2 || v.vr3 || v.vrb;
    const poolRef = v.vr1 || v.vr2 || v.vr3;
    const toRef   = state.pos === 'filtration' || state.pos === 'circulation';
    const toEgout = state.pos === 'lavage' || state.pos === 'rincage' || state.pos === 'egout';
    const destOK  = toRef ? (anyRef && outPath) : (toEgout ? v.ve : false);
    const flow    = state.pump && hasSuction && destOK;

    const active = {
      p_vb:    flow && v.vb,
      p_vbl:   flow && v.vbl,
      p_vbb:   flow && v.vbb,
      p_vbt1:  flow && v.vbt1,
      p_vbt2:  flow && v.vbt2,
      p_colL1: flow && v.vb,
      p_colL2: flow && (v.vb || v.vbl),
      p_colR1: flow && v.vbt1,
      p_colR2: flow && (v.vbt1 || v.vbb),
      p_colR3: flow && (v.vbt1 || v.vbb || v.vbt2),
      p_feed:  flow,
      p_pout:  flow,
      p_mpf:   flow && (state.pos === 'filtration' || state.pos === 'lavage' || state.pos === 'rincage'),
      p_mpfo:  flow && (state.pos === 'filtration' || state.pos === 'lavage' || state.pos === 'rincage'),
      p_mpo:   flow && toRef,
      p_eli:   flow && toRef && elPath,
      p_elo:   flow && toRef && elPath,
      p_byp:   flow && toRef && v.vby,
      p_fman:  flow && toRef && outPath,
      p_man1:  flow && toRef && outPath && anyRef,
      p_manb:  flow && toRef && outPath && v.vrb,
      p_man2:  flow && toRef && outPath && poolRef,
      p_man3:  flow && toRef && outPath && (v.vr1 || v.vr2),
      p_jr1:   flow && toRef && outPath && v.vr1,
      p_jr2:   flow && toRef && outPath && v.vr2,
      p_jr3:   flow && toRef && outPath && v.vr3,
      p_ego:   flow && toEgout && v.ve,
      p_over:  flow && toRef && outPath && poolRef,
      p_ev:    state.lowLevel,
    };

    // Alertes
    const warnings = [];
    if (state.pump && !hasSuction)
      warnings.push('⚠️ Pompe en marche sans aspiration ouverte — risque de marche à sec !');
    if (state.pump && hasSuction && !destOK && (toRef || toEgout))
      warnings.push('⚠️ Pompe en marche mais sortie fermée (refoulement/égout) — surpression !');
    if (state.pump && (state.pos === 'ferme' || state.pos === 'hivernage'))
      warnings.push('⛔ Vanne 6 voies FERMÉE/HIVERNAGE avec pompe en marche — INTERDIT !');
    if (flow && toEgout)
      warnings.push('ℹ️ Eau envoyée à l\'égout — le niveau de la piscine baisse.');
    if (state.pump && toRef && (v.vel1 !== v.vel2) && !v.vby)
      warnings.push('⚠️ Vannes électrolyseur incohérentes : entrée et sortie doivent être ouvertes toutes les deux (ou bypass ouvert).');
    if (state.lowLevel)
      warnings.push('💧 Niveau bac tampon BAS — électrovanne ouverte, remplissage automatique en eau de ville. L\'eau neuve dilue le sel : si ça se répète, chercher une fuite et re-tester le taux (cercle vicieux fuite → remplissage → sel qui baisse).');

    const electroOn = flow && toRef && elPath;
    return { active, warnings, electroOn };
  }

  // ---------- Rendu ----------
  function update() {
    const { active, warnings, electroOn } = computeFlow();

    // Tuyaux + flèches
    document.querySelectorAll('path.pipe').forEach(p => {
      const w = $('w_' + p.id);
      if (w) w.style.display = active[p.id] ? '' : 'none';
      const a = $('arr_' + p.id);
      if (a) a.style.display = active[p.id] ? '' : 'none';
    });

    // Vannes
    Object.entries(VALVES).forEach(([id, v]) => {
      $('valve_' + id).setAttribute('class', 'valve ' + (v.open ? 'open' : 'closed'));
    });

    // Pompe
    $('pumpCircle').setAttribute('fill', state.pump ? '#10b981' : '#94a3b8');
    $('pumpBtn').classList.toggle('on', state.pump);
    $('pumpBtn').textContent = state.pump ? '⏻ Pompe : MARCHE' : '⏻ Pompe : ARRÊT';

    // Vanne 6 voies
    const pos = MP_POSITIONS.find(p => p.id === state.pos);
    $('mpPosText').textContent = pos.label.toUpperCase();
    MP_POSITIONS.forEach(p => $('mp_' + p.id).classList.toggle('active', p.id === state.pos));

    // Bac tampon : niveau + électrovanne + capteur
    $('bacWater').setAttribute('y', state.lowLevel ? 498 : 434);
    $('bacWater').setAttribute('height', state.lowLevel ? 28 : 92);
    $('evRect').setAttribute('fill', state.lowLevel ? '#f59e0b' : '#94a3b8');
    $('sensorFloat').setAttribute('cy', state.lowLevel ? 500 : 442);
    $('sensorFloat').setAttribute('fill', state.lowLevel ? '#ef4444' : '#10b981');
    $('levelBtn').classList.toggle('low', state.lowLevel);
    $('levelBtn').textContent = state.lowLevel ? '💧 Bac tampon : NIVEAU BAS' : '💧 Bac tampon : niveau OK';

    // Électrolyseur
    $('electroRect').setAttribute('fill', electroOn ? '#bbf7d0' : '#e2e8f0');
    $('electroRect').setAttribute('stroke', electroOn ? '#10b981' : '#64748b');
    $('electroState').textContent = electroOn ? 'en service' : 'arrêté';

    // Scénarios
    Object.keys(SCENARIOS).forEach(id => {
      $('sc_' + id).classList.toggle('active', state.scenario === id);
    });

    // Alertes
    $('warnings').innerHTML = warnings.map(w => '<div class="warning">' + w + '</div>').join('');

    // Étapes — reconstruites uniquement au changement de scénario,
    // pour garder les coches pendant qu'on manipule les vannes
    const box = $('steps');
    if (state.scenario && state.scenario !== renderedScenario) {
      renderedScenario = state.scenario;
      const sc = SCENARIOS[state.scenario];
      box.innerHTML = '<h3>' + sc.title + '</h3>' +
        '<div class="hint">Clique sur une étape pour la cocher au fur et à mesure — la liste reste affichée pendant que tu manipules les vannes</div><ol>' +
        sc.steps.map(s => '<li>' + s + '</li>').join('') + '</ol>';
      box.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', () => li.classList.toggle('done'));
      });
    }
  }

  function applyScenario(id) {
    renderedScenario = null; // re-cliquer un scénario remet la check-list à zéro
    const sc = SCENARIOS[id];
    state.pump = sc.pump;
    state.pos = sc.pos;
    state.scenario = id;
    Object.entries(sc.v).forEach(([vid, open]) => VALVES[vid].open = open);
    update();
  }

  // ---------- Init ----------
  buildScenarios();
  buildMpButtons();
  buildValves();
  buildWaterOverlays();
  buildArrows();

  const toggleLevel = () => { state.lowLevel = !state.lowLevel; update(); };
  $('levelBtn').addEventListener('click', toggleLevel);
  $('sensorBody').addEventListener('click', toggleLevel);
  $('evBody').addEventListener('click', toggleLevel);

  $('pumpBtn').addEventListener('click', () => { state.pump = !state.pump; state.scenario = null; update(); });
  $('pumpBody').addEventListener('click', () => { state.pump = !state.pump; state.scenario = null; update(); });
  $('mpBody').addEventListener('click', () => {
    const i = MP_POSITIONS.findIndex(p => p.id === state.pos);
    state.pos = MP_POSITIONS[(i + 1) % MP_POSITIONS.length].id;
    state.scenario = null;
    update();
  });

  applyScenario('filtration');
</script>
</body>
</html>
